name: CI

on:
  push:
    branches: [main, development]
  pull_request:

# Dummy, non-secret env so the env-validating modules (env-server / env-client)
# load during type-check, tests and lint. These are NOT real credentials - they
# only need to satisfy the Zod shape. Real values live in the host's app
# settings. FIELD_ENCRYPTION_KEY is deliberately absent here: it is generated
# fresh per run in the first step below, so no key-shaped value is ever
# committed to this file (a committed one invites the question of whether it
# matches a real environment).
env:
  MODE: test
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-do-not-use-000
  EMAIL_FROM_ADDRESS: ci@example.com
  NEXT_PUBLIC_APP_TITLE: CI
  NEXT_PUBLIC_APP_DESCRIPTION: CI verification build
  NEXT_PUBLIC_APP_URL: https://ci.example.com
  NEXT_PUBLIC_APP_TIME_ZONE: Australia/Adelaide
  NEXT_PUBLIC_BETTER_AUTH_COOKIE_PREFIX: ci
  NEXT_PUBLIC_PASSWORD_MIN_LENGTH: "8"
  NEXT_PUBLIC_PASSWORD_MAX_LENGTH: "128"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A throwaway 32-byte key for this run only. The unit tests just
      # round-trip encrypt/decrypt, so any valid key works - and generating it
      # here means CI never needs a committed or stored one.
      - name: Generate a per-run field encryption key
        run: echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # pnpm 10 to match the repo's pnpm-workspace.yaml (settings-only, no
      # `packages:` field). pnpm 9 rejects it with "packages field missing or
      # empty" when setup-node runs `pnpm store path` for its cache.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      # Reports known vulnerabilities in production dependencies. Informational
      # for now (doesn't fail the build) so a new advisory can't block merges;
      # Dependabot opens the actual upgrade PRs.
      - name: Audit production dependencies
        run: pnpm audit --prod
        continue-on-error: true
