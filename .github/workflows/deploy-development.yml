name: Deploy development to Azure

# -------------------------------------------------------------------
# THE DEV SERVER. Every push to `development` lands on it.
#
# It is deploy.yml with two differences that matter, and they are the reason
# this is a separate file rather than a branch inside that one:
#
#   1. IT TRIGGERS ITSELF. deploy.yml is manual-only on purpose, so nothing
#      reaches production by merging. This one is the opposite by design -
#      a dev server that has to be deployed by hand stops being current, and
#      then stops being trusted.
#   2. IT RUNS THE TESTS FIRST. Production deploys are deliberate acts by
#      somebody who has already looked; this fires on every merge, so it is
#      the only thing standing between a red commit and the shared dev box.
#
# -------------------------------------------------------------------
# WHAT TO SET, AND WHERE.
#
# Settings -> Secrets and variables -> Actions. Four new entries, all at the
# REPOSITORY level - there is nothing to create first and no environment to
# configure:
#
#   AZURE_WEBAPP_NAME_DEV             Variable  the new App Service's name
#   NEXT_PUBLIC_APP_URL_DEV           Variable  its hostname, NO https://
#   AZURE_WEBAPP_PUBLISH_PROFILE_DEV  Secret    Get publish profile, whole XML
#   DATABASE_URL_DEV                  Secret    the DEV database, not production
#
# -------------------------------------------------------------------
# WHY SUFFIXED NAMES RATHER THAN A GITHUB ENVIRONMENT.
#
# An Environment is the tidier mechanism - the same names resolve to different
# values per target, so only what differs is set twice - and it is not
# available here: on a PRIVATE repository, Environments need Pro, Team or
# Enterprise, and on Free the Settings entry is absent rather than disabled.
#
# So the two targets are told apart by NAME instead. The cost is that four
# entries exist twice and a fifth could drift; the benefit is that this works
# on any plan and needs nothing set up beforehand. If the repo ever moves to a
# plan with Environments, this becomes `environment: development` and the four
# `_DEV` suffixes come off - the rest of the file is unchanged.
#
# EVERYTHING ELSE FALLS BACK TO THE SHARED VALUE. The `||` below is a real
# fallback rather than decoration: an unset Variable is an empty string, which
# is falsy, so `vars.X_DEV || vars.X` uses the dev-specific value when one
# exists and the shared one when it does not. The title, the password length
# pair, the timezone and the VAPID public key are the same app either way, and
# duplicating them would only create two places to forget.
#
# THE COOKIE PREFIX IS THE ONE OPTIONAL OVERRIDE. Sharing it is fine - the
# cookie is scoped to the hostname, so dev and production never see each
# other's - but setting NEXT_PUBLIC_BETTER_AUTH_COOKIE_PREFIX_DEV means a
# browser signed into both does not show two identically named cookies while
# you are debugging one of them.
#
# -------------------------------------------------------------------
# DATABASE_URL_DEV MUST BE THE DEV DATABASE, and this is the line to read
# twice.
#
# It is used at BUILD time here to prerender the public pages that show
# admin-editable site content, and it is a Secret, so nothing about a wrong
# value is visible afterwards. Pointing it at production would render
# production's content into a dev bundle - and the same mistake in the App
# Service's own settings would have the dev server WRITING to production.
#
# -------------------------------------------------------------------
# MODE IS `production` HERE, ON A DEV SERVER, AND THAT IS DELIBERATE.
#
# MODE is not "which environment is this", it is "is this reachable over the
# internet". Three things in auth.ts are gated on it, and all three are wrong
# for a public HTTPS host in any other mode:
#
#   useSecureCookies   off, so session cookies go without the Secure flag
#   rate limiting      off, so sign-in has no attempt limiter
#   trustedOrigins     widened to a list of loopback and tunnel origins
#
# It also decides whether SharePoint is faked (see dev-fake.ts, which returns
# a stub in any non-production mode). If you WANT the fake on this server so
# filing never touches a real library, set MODE in the App Service settings
# rather than here - the standalone server re-reads it at runtime, and this
# build-time value only has to satisfy the env schema. Know what you are
# turning off if you do.
#
# -------------------------------------------------------------------
# MIGRATIONS ARE NOT RUN BY THIS. They never have been anywhere in this repo -
# schema changes are applied by hand and recorded in schema_migrations. A
# deploy that lands code needing a column nobody has added yet will build,
# start, and fail on the first query that touches it.
# -------------------------------------------------------------------
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  # Scoped to this target so a dev deploy and a production one never wait on
  # each other. `cancel-in-progress` is TRUE here and false in deploy.yml, and
  # the difference is the point: three merges in ten minutes should put the
  # THIRD on the server, not queue three deploys of superseded commits.
  group: deploy-development-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Fail fast and loudly rather than half-deploying to a mistyped or unset
      # target. The publish profile is checked too: without it the deploy step
      # fails much later, after a full install, test and build, with an error
      # about credentials rather than about configuration.
      - name: Check the deploy target is configured
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
        run: |
          # `[ -z X ] && missing=...` is safe under the `bash -e` this runs
          # with, because bash exempts a command that fails as part of a
          # short-circuited && list. It stops being safe if one of these is
          # ever the LAST line: the step's exit status would then be the
          # failing test's, and a fully configured deploy would fail its own
          # guard. The echo at the bottom is what keeps that from happening,
          # so leave it there.
          missing=""
          [ -z "${{ vars.AZURE_WEBAPP_NAME_DEV }}" ] && missing="$missing AZURE_WEBAPP_NAME_DEV(Variable)"
          [ -z "${{ vars.NEXT_PUBLIC_APP_URL_DEV }}" ] && missing="$missing NEXT_PUBLIC_APP_URL_DEV(Variable)"
          [ -z "$PUBLISH_PROFILE" ] && missing="$missing AZURE_WEBAPP_PUBLISH_PROFILE_DEV(Secret)"
          [ -z "$DATABASE_URL_DEV" ] && missing="$missing DATABASE_URL_DEV(Secret)"

          if [ -n "$missing" ]; then
            echo "::error::Not configured. Missing:$missing"
            echo "See the comment at the top of this file for what each one is."
            exit 1
          fi

          echo "Deploying to: ${{ vars.AZURE_WEBAPP_NAME_DEV }}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm 10 to match the repo's pnpm-workspace.yaml (see ci.yml for why).
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A throwaway 32-byte key for this run only, exactly as ci.yml does it.
      # The unit tests round-trip encrypt and decrypt, so any valid key works,
      # and generating it here means no key-shaped value is ever committed.
      - name: Generate a per-run field encryption key
        run: echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # The gate. CI runs this too on the same push, but the two are
      # independent workflows - CI going red does not stop a deploy, so
      # without this the dev server would take every merge regardless. tsc and
      # lint are not repeated: `next build` below does both and fails on
      # either, so running them here would pay for the same work twice.
      #
      # -----------------------------------------------------------------
      # THE DUMMY ENV IS ON THE STEP, NOT THE WORKFLOW, AND THAT IS THE WHOLE
      # POINT OF WRITING IT OUT TWICE.
      #
      # env-client and env-server validate at IMPORT time, so a test that
      # never touches a URL still fails without one - vitest.config.ts feeds
      # them through `loadEnv`, which finds a local .env and finds nothing on
      # a runner. ci.yml solves this with a WORKFLOW-level env block, which is
      # right for a workflow that only ever verifies.
      #
      # It would be wrong here. This workflow also BUILDS, and a workflow-level
      # value is inherited by every step that does not override it - so one
      # NEXT_PUBLIC_* missing from the Build step below would silently fall
      # back to a dummy and get BAKED INTO THE DEPLOYED BUNDLE. The dev site
      # would come up titled "CI", pointing at ci.example.com, and nothing in
      # the run would be red. Step scope makes that impossible: these values
      # exist for the length of one `pnpm test` and are gone.
      #
      # They are dummies, not credentials - they only have to satisfy the Zod
      # shape. Keep them in step with ci.yml's block, which is the copy to
      # read if the schema gains a required variable.
      # -----------------------------------------------------------------
      - name: Test
        run: pnpm test
        env:
          MODE: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-do-not-use-000
          EMAIL_FROM_ADDRESS: ci@example.com
          NEXT_PUBLIC_APP_TITLE: CI
          NEXT_PUBLIC_APP_DESCRIPTION: CI verification build
          NEXT_PUBLIC_APP_URL: https://ci.example.com
          NEXT_PUBLIC_APP_TIME_ZONE: Australia/Adelaide
          NEXT_PUBLIC_BETTER_AUTH_COOKIE_PREFIX: ci
          NEXT_PUBLIC_PASSWORD_MIN_LENGTH: "8"
          NEXT_PUBLIC_PASSWORD_MAX_LENGTH: "128"

      # Built HERE on the CI runner rather than on the App Service, which was
      # OOM-hanging on `next build`. Because the build runs off-box, the values
      # it needs must be provided now. See deploy.yml for the full reasoning on
      # each - this list is deliberately identical to it, so the two servers
      # differ in their VALUES and never in what the build is given.
      - name: Build
        run: pnpm build
        env:
          BUILD_STANDALONE: "1"
          # See the note at the top. This is the build-time value; the running
          # server re-reads MODE from the App Service settings.
          MODE: production
          NEXT_PUBLIC_APP_TITLE: ${{ vars.NEXT_PUBLIC_APP_TITLE }}
          NEXT_PUBLIC_APP_DESCRIPTION: ${{ vars.NEXT_PUBLIC_APP_DESCRIPTION }}
          # The Variable holds the bare hostname; env-client validates it with
          # z.string().url(), which needs a scheme. Keep the Variable itself
          # scheme-less (no https://).
          NEXT_PUBLIC_APP_URL: https://${{ vars.NEXT_PUBLIC_APP_URL_DEV }}
          NEXT_PUBLIC_BETTER_AUTH_COOKIE_PREFIX: ${{ vars.NEXT_PUBLIC_BETTER_AUTH_COOKIE_PREFIX_DEV || vars.NEXT_PUBLIC_BETTER_AUTH_COOKIE_PREFIX }}
          NEXT_PUBLIC_PASSWORD_MIN_LENGTH: ${{ vars.NEXT_PUBLIC_PASSWORD_MIN_LENGTH }}
          NEXT_PUBLIC_PASSWORD_MAX_LENGTH: ${{ vars.NEXT_PUBLIC_PASSWORD_MAX_LENGTH }}
          NEXT_PUBLIC_APP_TIME_ZONE: ${{ vars.NEXT_PUBLIC_APP_TIME_ZONE }}
          # Baked into the client bundle, so setting it in App Service does
          # NOTHING. Its private half belongs in the App Service settings and
          # never in a Variable.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          # Never send email during a build; the host's setting controls the
          # live app.
          EMAIL_SEND_ENABLED: "false"
          # Placeholders only, and deliberately not key-shaped - the REAL
          # secret and key live in the App Service settings. Changing them
          # there makes existing encrypted fields and enrolled 2FA secrets
          # undecryptable, so they are set once and left alone.
          BETTER_AUTH_SECRET: build-only-placeholder-value-not-used-at-runtime
          FIELD_ENCRYPTION_KEY: build-only-placeholder-value-not-used-at-runtime-000000

      # `output: "standalone"` produces a self-contained server in
      # .next/standalone but does NOT copy static assets or /public into it -
      # do that here so the deployed package can serve them.
      - name: Assemble standalone deploy package
        run: |
          if [ ! -d .next/standalone ]; then
            echo "::error::.next/standalone is missing - the build step must set BUILD_STANDALONE=1 (see next.config.ts)."
            exit 1
          fi
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi

      # Zip the CONTENTS of the standalone folder (note the `cd`) so server.js
      # sits at the ROOT of the archive. Deploying the folder itself nests the
      # files under a subdirectory in wwwroot, and `node server.js` run from
      # /home/site/wwwroot then cannot find them.
      - name: Zip standalone package
        run: cd .next/standalone && zip -qr ../../deploy.zip .

      # Deploy the zip via OneDeploy; it extracts to /home/site/wwwroot with
      # server.js at the root, where the startup command expects it.
      #
      # TWO SETTINGS MUST ALREADY BE ON THE APP SERVICE, and neither can be
      # passed through this action with publish-profile auth:
      #
      #   Startup Command                 HOSTNAME=0.0.0.0 node server.js
      #   SCM_DO_BUILD_DURING_DEPLOYMENT  false
      #
      # HOSTNAME=0.0.0.0 so it binds every interface; Azure otherwise sets
      # HOSTNAME to the container name and the app is unreachable.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_DEV }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: deploy.zip
